name: Publish documentation

on:
  push:
    branches:
      - mkdocs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Regenerate Organizations API documentation
        run: sudo make graphql-docs

      - name: Check generated documentation is current
        run: |
          git status --short --untracked-files=all -- .graphqlrc.yml graphql src/docs/integratie/org-api
          test -z "$(git status --porcelain --untracked-files=all -- .graphqlrc.yml graphql src/docs/integratie/org-api)"

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12.12
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check submodules are clean
        run: git submodule foreach --recursive 'test -z "$(git status --porcelain)"'

      - name: Build documentation
        run: zensical build --clean --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
