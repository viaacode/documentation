site_name: Developer documentatie meemoo
site_url: https://developer.meemoo.be/
docs_dir: src
site_dir: site
use_directory_urls: false
strict: true

watch:
  - src/docs/diginstroom/sip/2.1/_data
  - src/docs/diginstroom/sip/3.0/_data

theme:
  name: material
  language: nl
  logo: assets/meemoo-logo_lockup-pos-rgb.svg
  favicon: favicon.ico
  features:
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: [nl, en]
  - macros:
      render_by_default: false
      force_render_paths: |
        docs/diginstroom/sip/2.1/
        docs/diginstroom/sip/3.0/
      include_dir: src
      on_error_fail: true
      on_undefined: strict
      include_yaml:
        - sip_2_1_basic: src/docs/diginstroom/sip/2.1/_data/BASIC_PROFILE.json
        - sip_2_1_bibliographic: src/docs/diginstroom/sip/2.1/_data/BIBLIOGRAPHIC_PROFILE.json
        - sip_2_1_film: src/docs/diginstroom/sip/2.1/_data/FILM_PROFILE.json
        - sip_2_1_general: src/docs/diginstroom/sip/2.1/_data/GENERAL.json
        - sip_2_1_material_artwork: src/docs/diginstroom/sip/2.1/_data/MATERIAL_ARTWORK_PROFILE.json
        - sip_3_0_basic: src/docs/diginstroom/sip/3.0/_data/BASIC_PROFILE.json
        - sip_3_0_bibliographic: src/docs/diginstroom/sip/3.0/_data/BIBLIOGRAPHIC_PROFILE.json
        - sip_3_0_film: src/docs/diginstroom/sip/3.0/_data/FILM_PROFILE.json
        - sip_3_0_general: src/docs/diginstroom/sip/3.0/_data/GENERAL.json
        - sip_3_0_material_artwork: src/docs/diginstroom/sip/3.0/_data/MATERIAL_ARTWORK_PROFILE.json

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Metadata:
      - docs/metadata/index.md
      - VIAA Metadatamodel:
          - docs/metadata/viaa/index.md
          - "Velden: Algemeen": docs/metadata/viaa/algemeen.md
          - "Velden: Registratie dragers": docs/metadata/viaa/registratie.md
          - "Velden: Digitaliseringsproces": docs/metadata/viaa/digitalisering.md
          - Datatypes: docs/metadata/viaa/datatypes.md
          - Licenties: docs/metadata/viaa/licenties.md
      - Knowledge Graph:
          - docs/metadata/knowledge-graph/index.md
          - Objecten: docs/metadata/knowledge-graph/1.0.0/objects/en/index.md
          - Organisaties: docs/metadata/knowledge-graph/1.0.0/organizations/en/index.md
          - Descriptie: docs/metadata/knowledge-graph/1.1.0/description/en/index.md
          - Data herkomst: docs/metadata/knowledge-graph/1.0.0/events/en/index.md
          - Termenlijsten: docs/metadata/knowledge-graph/1.0.0/terms/en/index.md
          - Rechten: docs/metadata/knowledge-graph/1.1.0/rights/en/index.md
  - Digitale instroom:
      - docs/diginstroom/index.md
      - SIP Specification:
          - docs/diginstroom/sip/index.md
          - "2.1":
              - docs/diginstroom/sip/2.1/index.md
              - Introduction: docs/diginstroom/sip/2.1/1_introduction.md
              - Terminology: docs/diginstroom/sip/2.1/2_terminology.md
