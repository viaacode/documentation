                  - Basic: docs/diginstroom/sip/2.1/profiles/basic.md
                  - Bibliographic: docs/diginstroom/sip/2.1/profiles/bibliographic.md
                  - Material artwork: docs/diginstroom/sip/2.1/profiles/material-artwork.md
                  - Film: docs/diginstroom/sip/2.1/profiles/film.md
              - Use cases:
