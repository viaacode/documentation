not_in_nav: |
  assets/sip_assets/README.md
  docs/diginstroom/sip/3.0/**
  docs/metadata/knowledge-graph/0.0.1/**
  docs/metadata/knowledge-graph/**/fr/**
  docs/metadata/knowledge-graph/**/nl/**
  docs/metadata/knowledge-graph/1.0.0/audiovisual/**
  docs/metadata/knowledge-graph/1.0.0/bibliographic/**
  docs/metadata/knowledge-graph/1.0.0/description/**
  docs/metadata/knowledge-graph/1.0.0/film/**
  docs/metadata/knowledge-graph/1.1.0/audiovisual/**

exclude_docs: |
  **/_data/**
  **/*.j2
  **/.github/**
  docs/diginstroom/sip/*/README.md
  **/scripts/**
  **/tests/**

validation:
  nav:
    omitted_files: warn
    not_found: info
    absolute_links: relative_to_docs
  links:
    not_found: info
    absolute_links: relative_to_docs
    unrecognized_links: info
    anchors: info
