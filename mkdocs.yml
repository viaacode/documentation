site_name: meemoo developer documentation
site_url: https://developer.meemoo.be/
docs_dir: src
site_dir: site
use_directory_urls: false
strict: true

watch:
  - src/docs/diginstroom/sip/2.1/_data
  - src/docs/diginstroom/sip/3.0/_data

theme:
  name: material
  language: en
  logo: /assets/meemoo-logo_lockup-pos-rgb.svg
  favicon: /favicon.ico
  features:
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - content.code.copy

extra_css:
  - /assets/stylesheets/extra.css

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: nl
          name: Nederlands
          build: true
          site_name: Developerdocumentatie meemoo
          nav:
            - Home: index.md
            - Metadata:
                - docs/metadata/index.md
                - VIAA-metadatamodel:
                    - docs/metadata/viaa/index.md
                    - "Velden: Algemeen": docs/metadata/viaa/algemeen.md
                    - "Velden: Registratie dragers": docs/metadata/viaa/registratie.md
                    - "Velden: Digitaliseringsproces": docs/metadata/viaa/digitalisering.md
                    - Datatypes: docs/metadata/viaa/datatypes.md
                    - Licenties: docs/metadata/viaa/licenties.md
                - Knowledge Graph:
                    - docs/metadata/knowledge-graph/index.md
                    - Objecten: docs/metadata/knowledge-graph/1.0.0/objects/index.md
                    - Organisaties: docs/metadata/knowledge-graph/1.0.0/organizations/index.md
                    - Descriptie: docs/metadata/knowledge-graph/1.1.0/description/index.md
                    - Dataherkomst: docs/metadata/knowledge-graph/1.0.0/events/index.md
                    - Termenlijsten: docs/metadata/knowledge-graph/1.0.0/terms/index.md
                    - Rechten: docs/metadata/knowledge-graph/1.1.0/rights/index.md
            - Digitale instroom:
                - docs/diginstroom/index.md
                - Aanlevering van SIPs: docs/diginstroom/aanlevering-van-sips.md
            - Een integratie ontwikkelen:
                - docs/integratie/index.md
                - REST API v1 en v2: docs/integratie/rest-api.md
                - OAI-PMH: docs/integratie/oai-pmh.md
                - IIIF 3.0 Image API: docs/integratie/iiif.md
                - Webhook Status Events: docs/integratie/webhook-status-events.md
                - AI metadata API: docs/integratie/ai-metadata-api.md
        - locale: fr
          name: Français
          build: false
  - redirects:
      redirect_maps:
        docs/metadata/knowledge-graph/0.0.1/audiovisual/en/index.md: docs/metadata/knowledge-graph/0.0.1/audiovisual/index.md
        docs/metadata/knowledge-graph/0.0.1/audiovisual/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/audiovisual/index.html
        docs/metadata/knowledge-graph/0.0.1/bibliographic/en/index.md: docs/metadata/knowledge-graph/0.0.1/bibliographic/index.md
        docs/metadata/knowledge-graph/0.0.1/bibliographic/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/bibliographic/index.html
        docs/metadata/knowledge-graph/0.0.1/description/en/index.md: docs/metadata/knowledge-graph/0.0.1/description/index.md
        docs/metadata/knowledge-graph/0.0.1/description/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/description/index.html
        docs/metadata/knowledge-graph/0.0.1/events/en/index.md: docs/metadata/knowledge-graph/0.0.1/events/index.md
        docs/metadata/knowledge-graph/0.0.1/events/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/events/index.html
        docs/metadata/knowledge-graph/0.0.1/film/en/index.md: docs/metadata/knowledge-graph/0.0.1/film/index.md
        docs/metadata/knowledge-graph/0.0.1/film/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/film/index.html
        docs/metadata/knowledge-graph/0.0.1/objects/en/index.md: docs/metadata/knowledge-graph/0.0.1/objects/index.md
        docs/metadata/knowledge-graph/0.0.1/objects/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/objects/index.html
        docs/metadata/knowledge-graph/0.0.1/organizations/en/index.md: docs/metadata/knowledge-graph/0.0.1/organizations/index.md
        docs/metadata/knowledge-graph/0.0.1/organizations/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/organizations/index.html
        docs/metadata/knowledge-graph/0.0.1/terms/en/index.md: docs/metadata/knowledge-graph/0.0.1/terms/index.md
        docs/metadata/knowledge-graph/0.0.1/terms/nl/index.md: /nl/docs/metadata/knowledge-graph/0.0.1/terms/index.html
        docs/metadata/knowledge-graph/1.0.0/audiovisual/en/index.md: docs/metadata/knowledge-graph/1.0.0/audiovisual/index.md
