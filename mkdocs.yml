  - search
  - macros:
      render_by_default: false
      force_render_paths: |
        docs/diginstroom/sip/2.1/
        docs/diginstroom/sip/3.0/
      include_dir: src
      on_error_fail: true
      on_undefined: strict
      include_yaml:
        - sip_2_1_basic: src/docs/diginstroom/sip/2.1/_data/BASIC_PROFILE.json
        - sip_2_1_bibliographic: src/docs/diginstroom/sip/2.1/_data/BIBLIOGRAPHIC_PROFILE.json
        - sip_2_1_film: src/docs/diginstroom/sip/2.1/_data/FILM_PROFILE.json
        - sip_2_1_general: src/docs/diginstroom/sip/2.1/_data/GENERAL.json
        - sip_2_1_material_artwork: src/docs/diginstroom/sip/2.1/_data/MATERIAL_ARTWORK_PROFILE.json
        - sip_3_0_basic: src/docs/diginstroom/sip/3.0/_data/BASIC_PROFILE.json
        - sip_3_0_bibliographic: src/docs/diginstroom/sip/3.0/_data/BIBLIOGRAPHIC_PROFILE.json
        - sip_3_0_film: src/docs/diginstroom/sip/3.0/_data/FILM_PROFILE.json
        - sip_3_0_general: src/docs/diginstroom/sip/3.0/_data/GENERAL.json
        - sip_3_0_material_artwork: src/docs/diginstroom/sip/3.0/_data/MATERIAL_ARTWORK_PROFILE.json

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

